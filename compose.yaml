name: leadqual

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Falta POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?Falta POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  core-api:
    build:
      context: .
      dockerfile: express/Dockerfile
    init: true
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      NODE_ENV: development
      JWT_SECRET_HEX: "${JWT_SECRET_HEX:-}"
      ASSIGNMENT_SMTP_URL: smtp://mailpit:1025
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: "${POSTGRES_DB:?Falta POSTGRES_DB}"
      PGUSER: "${POSTGRES_USER:?Falta POSTGRES_USER}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - backend
    depends_on:
      core-api:
        condition: service_started
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 5

  ai-gateway:
    build:
      context: .
      dockerfile: python/Dockerfile
    init: true
    environment:
      HOST: "0.0.0.0"
      PORT: "3100"
      AI_GATEWAY_ENV: "${AI_GATEWAY_ENV:-production}"
      AI_GATEWAY_PROVIDER: "${AI_GATEWAY_PROVIDER:-gemini}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -B
        - -c
        - >-
          from urllib.request import urlopen;
          urlopen('http://127.0.0.1:3100/ready', timeout=2).close()
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
